<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPOTR — Live Monitor</title>
<style>
  :root {
    /* State colors */
    --idle:    #16c784;
    --active:  #2f80ed;
    --warning: #f2a900;
    --alarm:   #ff3b3b;

    --idle-dim:    #0c5a3c;
    --active-dim:  #123a6b;
    --warning-dim: #6b4c00;
    --alarm-dim:   #6b1414;

    /* Current state channel — JS overwrites these two on the root */
    --state:     var(--idle);
    --state-dim: var(--idle-dim);

    --bg:      #060708;
    --panel:   #0d0f12;
    --panel-2: #101318;
    --line:    #1c2129;
    --text:    #e9edf2;
    --muted:   #7a828c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Status banner ---------- */
  #banner {
    width: 100%;
    padding: 22px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    background: var(--state);
    color: #fff;
    transition: background-color 0.6s ease, box-shadow 0.6s ease;
    box-shadow: 0 0 60px -12px var(--state);
  }
  #banner .state-label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #banner .kicker {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.75;
  }
  #banner .state-text {
    font-size: clamp(34px, 6vw, 64px);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1;
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
  }
  #banner .brand {
    font-size: clamp(20px, 3vw, 34px);
    font-weight: 800;
    letter-spacing: 0.32em;
    opacity: 0.9;
  }
  #banner .brand small {
    display: block;
    font-size: 11px;
    letter-spacing: 0.24em;
    font-weight: 600;
    opacity: 0.7;
    margin-top: 4px;
  }

  /* alarm banner pulse */
  body.alarm #banner {
    animation: bannerPulse 1s ease-in-out infinite;
  }
  @keyframes bannerPulse {
    0%, 100% { box-shadow: 0 0 60px -12px var(--state); }
    50%      { box-shadow: 0 0 110px 0px var(--state); }
  }

  /* ---------- Main layout ---------- */
  main {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 28px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- Camera view ---------- */
  #camera {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    background:
      radial-gradient(120% 120% at 50% 0%, #12151b 0%, #08090c 70%);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.6);
    transition: box-shadow 0.6s ease, border-color 0.6s ease;
  }
  body.alarm #camera {
    border-color: var(--state);
    animation: cameraPulse 1s ease-in-out infinite;
  }
  @keyframes cameraPulse {
    0%, 100% { box-shadow: inset 0 0 120px rgba(0,0,0,0.6), 0 0 0px 0px var(--state); }
    50%      { box-shadow: inset 0 0 120px rgba(0,0,0,0.6), inset 0 0 90px -20px var(--state); }
  }

  /* faint scan grid for the "monitor" feel */
  #camera::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  #scene { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* LIVE indicator */
  #live {
    position: absolute;
    top: 14px; right: 16px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.18em;
    color: #e9edf2;
    padding: 6px 10px;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--line);
    border-radius: 6px;
    backdrop-filter: blur(2px);
  }
  #live .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 8px #ff3b3b;
    animation: blink 1.4s steps(1, end) infinite;
  }
  @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: 0.15; } }

  /* Bar height label */
  #barLabel {
    position: absolute;
    left: 14px; top: 14px;
    font-size: 12px; letter-spacing: 0.1em;
    color: var(--muted);
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    font-variant-numeric: tabular-nums;
  }
  #barLabel b { color: var(--text); font-weight: 700; }

  /* rack / camera meta bottom-left */
  #camMeta {
    position: absolute;
    left: 14px; bottom: 12px;
    font-size: 11px; letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ---------- Stats row ---------- */
  #stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  /* Reserve room so the fixed Simulate panel never covers the Elapsed timer */
  @media (min-width: 721px) {
    #stats { padding-right: 244px; }
  }
  .tile {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 132px;
    justify-content: space-between;
  }
  .tile .tile-label {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .tile .tile-value {
    font-size: clamp(40px, 7vw, 68px);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .tile .tile-value .unit {
    font-size: 0.32em;
    font-weight: 600;
    color: var(--muted);
    margin-left: 8px;
    letter-spacing: 0.15em;
    vertical-align: baseline;
  }
  /* accent bar-speed & elapsed tint to state */
  #barSpeed.hot { color: var(--state); transition: color 0.6s ease; }

  /* ---------- Ambient LED indicator ---------- */
  #ledWrap {
    position: fixed;
    left: 22px; bottom: 22px;
    display: flex; align-items: center; gap: 12px;
    z-index: 20;
    pointer-events: none;
  }
  #led {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--state);
    box-shadow: 0 0 22px 4px var(--state);
    transition: background-color 0.6s ease, box-shadow 0.6s ease;
  }
  body.alarm #led { animation: ledPulse 1s ease-in-out infinite; }
  @keyframes ledPulse {
    0%,100% { box-shadow: 0 0 22px 4px var(--state); }
    50%     { box-shadow: 0 0 40px 10px var(--state); }
  }
  #ledWrap .led-caption {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Simulate control panel ---------- */
  #sim {
    position: fixed;
    right: 20px; bottom: 20px;
    z-index: 30;
    width: 220px;
    background: rgba(14, 17, 22, 0.86);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    backdrop-filter: blur(6px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  }
  #sim .sim-title {
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 12px;
  }
  #sim .sim-title::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
  }
  #sim .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #sim button {
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
    background: #171b21;
    border: 1px solid #262c35;
    border-radius: 8px;
    padding: 10px 6px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease, opacity 0.2s ease;
  }
  #sim button:hover:not(:disabled) { background: #1f242c; border-color: #38414d; }
  #sim button:active:not(:disabled) { transform: translateY(1px); }
  #sim button:disabled { opacity: 0.3; cursor: not-allowed; }
  #sim button[data-act="start"]:not(:disabled)  { border-color: var(--active);  color: #cfe0ff; }
  #sim button[data-act="stall"]:not(:disabled)  { border-color: var(--warning); color: #ffe6a8; }
  #sim button[data-act="resolve"]:not(:disabled){ border-color: var(--idle);    color: #b6f2d7; }
  #sim button[data-act="reset"]  { grid-column: 1 / -1; }

  @media (max-width: 720px) {
    #stats { grid-template-columns: 1fr; }
    #sim { left: 20px; right: 20px; width: auto; }
    #ledWrap { display: none; }
  }
</style>
</head>
<body>

  <!-- ===== Status banner ===== -->
  <header id="banner">
    <div class="state-label">
      <span class="kicker">System Status</span>
      <span class="state-text" id="stateText">IDLE</span>
    </div>
    <div class="brand">SPOTR<small>Rack Safety Monitor</small></div>
  </header>

  <main>
    <!-- ===== Camera view ===== -->
    <section id="camera">
      <svg id="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet">
        <!-- rack uprights -->
        <line x1="150" y1="40" x2="150" y2="330" stroke="#2a303a" stroke-width="6" stroke-linecap="round"/>
        <line x1="490" y1="40" x2="490" y2="330" stroke="#2a303a" stroke-width="6" stroke-linecap="round"/>
        <line x1="120" y1="330" x2="520" y2="330" stroke="#20252e" stroke-width="4"/>

        <!-- Skeleton group (joints + limbs) -->
        <g id="skeleton" stroke="var(--state)" stroke-width="4" stroke-linecap="round" fill="var(--state)">
          <!-- limbs -->
          <line id="l_neck"   x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_spine"  x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_uarmL"  x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_farmL"  x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_uarmR"  x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_farmR"  x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_thighL" x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_shinL"  x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_thighR" x1="0" y1="0" x2="0" y2="0"/>
          <line id="l_shinR"  x1="0" y1="0" x2="0" y2="0"/>
          <!-- head -->
          <circle id="j_head" cx="0" cy="0" r="16" fill="none" stroke-width="4"/>
          <!-- joints -->
          <circle id="j_neck"  r="4"/>
          <circle id="j_hip"   r="4"/>
          <circle id="j_shL"   r="4"/><circle id="j_elL" r="4"/><circle id="j_haL" r="4"/>
          <circle id="j_shR"   r="4"/><circle id="j_elR" r="4"/><circle id="j_haR" r="4"/>
          <circle id="j_knL"   r="4"/><circle id="j_ftL" r="4"/>
          <circle id="j_knR"   r="4"/><circle id="j_ftR" r="4"/>
        </g>

        <!-- Barbell -->
        <g id="barbell">
          <line id="bar" x1="120" y1="150" x2="520" y2="150" stroke="#e9edf2" stroke-width="5" stroke-linecap="round"/>
          <rect id="plateL" x="128" y="130" width="12" height="40" rx="3" fill="#c7ccd4"/>
          <rect id="plateR" x="500" y="130" width="12" height="40" rx="3" fill="#c7ccd4"/>
        </g>
      </svg>

      <div id="barLabel">BAR HEIGHT&nbsp; <b id="barHeight">1.05 m</b></div>
      <div id="live"><span class="dot"></span> LIVE</div>
      <div id="camMeta">CAM 01 · RACK A · 30 FPS</div>
    </section>

    <!-- ===== Stats ===== -->
    <section id="stats">
      <div class="tile">
        <div class="tile-label">Reps</div>
        <div class="tile-value" id="reps">0</div>
      </div>
      <div class="tile">
        <div class="tile-label">Bar Speed</div>
        <div class="tile-value"><span id="barSpeed">—</span><span class="unit">m/s</span></div>
      </div>
      <div class="tile">
        <div class="tile-label" id="timerLabel">Elapsed · Idle</div>
        <div class="tile-value" id="elapsed">00:00</div>
      </div>
    </section>
  </main>

  <!-- ===== Ambient LED ===== -->
  <div id="ledWrap">
    <div id="led"></div>
    <div class="led-caption">Rack&nbsp;LED</div>
  </div>

  <!-- ===== Simulate control panel ===== -->
  <aside id="sim">
    <div class="sim-title">Simulate · Judge/Dev</div>
    <div class="btns">
      <button data-act="start"   id="btnStart">Start Lift</button>
      <button data-act="stall"   id="btnStall">Trigger Stall</button>
      <button data-act="resolve" id="btnResolve">Resolve</button>
      <button data-act="reset"   id="btnReset">Reset</button>
    </div>
  </aside>

<script>
(() => {
  "use strict";

  // ---------- State constants ----------
  const S = { IDLE: "IDLE", ACTIVE: "ACTIVE", WARNING: "WARNING", ALARM: "ALARM" };
  const STATE_TEXT = { IDLE: "IDLE", ACTIVE: "ACTIVE LIFT", WARNING: "WARNING", ALARM: "ALARM" };
  const STATE_VARS = {
    IDLE:    ["var(--idle)",    "var(--idle-dim)"],
    ACTIVE:  ["var(--active)",  "var(--active-dim)"],
    WARNING: ["var(--warning)", "var(--warning-dim)"],
    ALARM:   ["var(--alarm)",   "var(--alarm-dim)"],
  };
  const WARNING_SECONDS = 6;

  // ---------- Runtime state ----------
  const st = {
    state: S.IDLE,
    reps: 0,
    stateEnteredAt: performance.now(),
    phase: 0,          // 0..1 progress through current lift cycle (0/1 = top, 0.5 = bottom)
    lastPhase: 0,
    barSpeed: 0,
    warningTimeout: null,
    frozenBarNorm: 0,  // captured bar normalized position when we freeze
  };

  // ---------- DOM refs ----------
  const root      = document.documentElement;
  const body      = document.body;
  const stateText = document.getElementById("stateText");
  const repsEl    = document.getElementById("reps");
  const barSpeedEl= document.getElementById("barSpeed");
  const elapsedEl = document.getElementById("elapsed");
  const timerLbl  = document.getElementById("timerLabel");
  const barHeight = document.getElementById("barHeight");

  const btn = {
    start:   document.getElementById("btnStart"),
    stall:   document.getElementById("btnStall"),
    resolve: document.getElementById("btnResolve"),
    reset:   document.getElementById("btnReset"),
  };

  // ---------- Skeleton element map ----------
  const el = id => document.getElementById(id);
  const joints = {
    head: el("j_head"),
    neck: el("j_neck"), hip: el("j_hip"),
    shL: el("j_shL"), elL: el("j_elL"), haL: el("j_haL"),
    shR: el("j_shR"), elR: el("j_elR"), haR: el("j_haR"),
    knL: el("j_knL"), ftL: el("j_ftL"),
    knR: el("j_knR"), ftR: el("j_ftR"),
  };
  const limbs = {
    neck: el("l_neck"), spine: el("l_spine"),
    uarmL: el("l_uarmL"), farmL: el("l_farmL"),
    uarmR: el("l_uarmR"), farmR: el("l_farmR"),
    thighL: el("l_thighL"), shinL: el("l_shinL"),
    thighR: el("l_thighR"), shinR: el("l_shinR"),
  };
  const barLine = el("bar"), plateL = el("plateL"), plateR = el("plateR");

  const setJoint = (j, x, y) => { j.setAttribute("cx", x); j.setAttribute("cy", y); };
  const setLimb  = (l, a, b) => {
    l.setAttribute("x1", a[0]); l.setAttribute("y1", a[1]);
    l.setAttribute("x2", b[0]); l.setAttribute("y2", b[1]);
  };

  // ---------- Pose model ----------
  // depth: 0 = standing tall, 1 = deep squat. Drives a full-body squat with the
  // bar racked on the shoulders (arms up gripping the bar).
  function pose(depth, breathe) {
    const cx = 320;
    const sink = 78 * depth;              // how far the whole body drops
    const b = breathe * 2;                // subtle idle breathing offset

    const hipY   = 210 + sink + b;
    const shY    = 138 + sink * 0.75 + b; // shoulders sink a bit less than hips
    const neckY  = shY - 6;
    const headY  = shY - 30;

    // legs widen slightly as they bend
    const spread = 24 + 10 * depth;
    const hip    = [cx, hipY];
    const shC    = [cx, shY];
    const neck   = [cx, neckY];
    const head   = [cx, headY];

    const shL = [cx - 30, shY], shR = [cx + 30, shY];
    // hands up on the bar, near the shoulders
    const haL = [cx - 42, shY - 20], haR = [cx + 42, shY - 20];
    const elL = [cx - 46, shY + 6],  elR = [cx + 46, shY + 6];

    const knY = hipY + 48 - 6 * depth;
    const knL = [cx - spread, knY], knR = [cx + spread, knY];
    const ftY = 300;
    const ftL = [cx - spread - 4, ftY], ftR = [cx + spread + 4, ftY];

    // joints
    joints.head.setAttribute("cx", head[0]); joints.head.setAttribute("cy", head[1]);
    setJoint(joints.neck, neck[0], neck[1]);
    setJoint(joints.hip,  hip[0],  hip[1]);
    setJoint(joints.shL, shL[0], shL[1]); setJoint(joints.elL, elL[0], elL[1]); setJoint(joints.haL, haL[0], haL[1]);
    setJoint(joints.shR, shR[0], shR[1]); setJoint(joints.elR, elR[0], elR[1]); setJoint(joints.haR, haR[0], haR[1]);
    setJoint(joints.knL, knL[0], knL[1]); setJoint(joints.ftL, ftL[0], ftL[1]);
    setJoint(joints.knR, knR[0], knR[1]); setJoint(joints.ftR, ftR[0], ftR[1]);

    // limbs
    setLimb(limbs.neck,  neck, [head[0], head[1] + 16]);
    setLimb(limbs.spine, neck, hip);
    setLimb(limbs.uarmL, shL, elL); setLimb(limbs.farmL, elL, haL);
    setLimb(limbs.uarmR, shR, elR); setLimb(limbs.farmR, elR, haR);
    setLimb(limbs.thighL, hip, knL); setLimb(limbs.shinL, knL, ftL);
    setLimb(limbs.thighR, hip, knR); setLimb(limbs.shinR, knR, ftR);

    // bar sits on the hands
    const barY = haL[1];
    barLine.setAttribute("y1", barY); barLine.setAttribute("y2", barY);
    plateL.setAttribute("y", barY - 20); plateR.setAttribute("y", barY - 20);
    return barY;
  }

  // Map SVG barY (~118 top .. ~200 bottom) to a friendly "height in meters".
  function barYToMeters(y) {
    const top = 118, bot = 210;
    const norm = (bot - y) / (bot - top);        // 1 at top, 0 at bottom
    return (0.95 + norm * 0.85).toFixed(2);      // 0.95 m .. ~1.80 m
  }

  // ---------- Button enablement per state ----------
  function refreshButtons() {
    const s = st.state;
    btn.start.disabled   = !(s === S.IDLE);
    btn.stall.disabled   = !(s === S.ACTIVE);
    btn.resolve.disabled = !(s === S.WARNING || s === S.ALARM);
    btn.reset.disabled   = false;
  }

  // ---------- State transition ----------
  function setState(next) {
    if (st.warningTimeout) { clearTimeout(st.warningTimeout); st.warningTimeout = null; }

    st.state = next;
    st.stateEnteredAt = performance.now();

    // color channel
    const [c, dim] = STATE_VARS[next];
    root.style.setProperty("--state", c);
    root.style.setProperty("--state-dim", dim);

    stateText.textContent = STATE_TEXT[next];
    body.classList.toggle("alarm", next === S.ALARM);

    // per-state setup
    if (next === S.IDLE) {
      st.reps = 0;
      st.barSpeed = 0;
      st.phase = 0; st.lastPhase = 0;
      barSpeedEl.textContent = "—";
      barSpeedEl.classList.remove("hot");
      timerLbl.textContent = "Elapsed · Idle";
    } else if (next === S.ACTIVE) {
      barSpeedEl.classList.add("hot");
      timerLbl.textContent = "Elapsed · Lift";
    } else if (next === S.WARNING) {
      st.frozenBarNorm = currentDepth();     // freeze pose where it is
      st.barSpeed = 0;
      barSpeedEl.textContent = "0.00";
      timerLbl.textContent = "Self-Resolve";
      // auto-escalate if not resolved
      st.warningTimeout = setTimeout(() => setState(S.ALARM), WARNING_SECONDS * 1000);
    } else if (next === S.ALARM) {
      barSpeedEl.textContent = "0.00";
      timerLbl.textContent = "Alarm · Escalated";
    }

    refreshButtons();
  }

  // depth (0..1) at the current phase — shared by animate + freeze capture
  function currentDepth() {
    // phase 0 -> top(0), 0.5 -> bottom(1), 1 -> top(0)
    return (1 - Math.cos(st.phase * Math.PI * 2)) / 2;
  }

  // ---------- Main animation loop ----------
  const CYCLE_MS = 2600;   // one full rep
  let last = performance.now();

  function frame(now) {
    const dt = now - last;
    last = now;

    const moving = st.state === S.ACTIVE;
    const idle   = st.state === S.IDLE;

    if (moving) {
      st.lastPhase = st.phase;
      st.phase += dt / CYCLE_MS;
      if (st.phase >= 1) {
        st.phase -= 1;
        st.reps += 1;                    // completed a full up-down cycle
        repsEl.textContent = st.reps;
      }
    }

    // Determine depth for rendering
    let depth, breathe = 0;
    if (idle) {
      depth = 0;
      breathe = Math.sin(now / 1400);    // gentle breathing bob
    } else if (moving) {
      depth = currentDepth();
    } else {
      // WARNING / ALARM: frozen at captured depth
      depth = st.frozenBarNorm;
    }

    const barY = pose(depth, breathe);
    barHeight.textContent = barYToMeters(barY) + " m";

    // Bar speed readout — derived from phase velocity, only while lifting
    if (moving) {
      const vel = Math.abs(Math.sin(st.phase * Math.PI * 2)); // fast mid-rep, slow at ends
      // simulated m/s with a little jitter
      st.barSpeed = 0.15 + vel * 0.85 + (Math.random() - 0.5) * 0.05;
      barSpeedEl.textContent = st.barSpeed.toFixed(2);
    }

    // Elapsed / countdown timer
    const elapsedMs = now - st.stateEnteredAt;
    if (st.state === S.WARNING) {
      const remain = Math.max(0, WARNING_SECONDS - elapsedMs / 1000);
      elapsedEl.textContent = remain.toFixed(1) + "s";
    } else {
      elapsedEl.textContent = fmtClock(elapsedMs);
    }

    requestAnimationFrame(frame);
  }

  function fmtClock(ms) {
    const total = Math.floor(ms / 1000);
    const m = String(Math.floor(total / 60)).padStart(2, "0");
    const s = String(total % 60).padStart(2, "0");
    return m + ":" + s;
  }

  // ---------- Wire up controls ----------
  btn.start.addEventListener("click",   () => { if (st.state === S.IDLE) setState(S.ACTIVE); });
  btn.stall.addEventListener("click",   () => { if (st.state === S.ACTIVE) setState(S.WARNING); });
  btn.resolve.addEventListener("click", () => { if (st.state === S.WARNING || st.state === S.ALARM) setState(S.ACTIVE); });
  btn.reset.addEventListener("click",   () => setState(S.IDLE));

  // Keyboard shortcuts for a smooth live demo (1..4)
  window.addEventListener("keydown", (e) => {
    if (e.key === "1") btn.start.click();
    else if (e.key === "2") btn.stall.click();
    else if (e.key === "3") btn.resolve.click();
    else if (e.key === "4") btn.reset.click();
  });

  // ---------- Boot ----------
  setState(S.IDLE);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
